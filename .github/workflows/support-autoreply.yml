name: Support acknowledgement
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  acknowledge:
    if: startsWith(github.event.issue.title, '[Support]:')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thank you for contacting Noir Commerce support. Your request has been received and will be reviewed within two business days. Do not post passwords, access tokens, customer data, or other sensitive information.'
            })
